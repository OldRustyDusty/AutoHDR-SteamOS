name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Ubuntu 22.04 (glibc 2.35) so the layer only needs glibc 2.34: it then
    # runs on SteamOS 3.x, Bazzite and most current desktop distros.
    container: ubuntu:22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            meson ninja-build g++ glslang-tools libvulkan-dev python3 zip binutils git ca-certificates

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build layer and Decky plugin
        run: scripts/package-decky.sh

      - name: Check the layer's glibc requirement
        run: |
          need=$(objdump -T out/hdrket/bin/libhdrket.so | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          echo "libhdrket.so needs $need"
          [ "$need" = "GLIBC_2.34" ] || [ "$(printf '%s\nGLIBC_2.34\n' "$need" | sort -V | tail -1)" = "GLIBC_2.34" ]

      - uses: actions/upload-artifact@v4
        with:
          name: autohdr-steamos-decky
          path: out/autohdr-steamos-decky.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/autohdr-steamos-decky.zip
            scripts/install.sh
            scripts/AutoHDR-installer.desktop
          generate_release_notes: true
          body: |
            **Install (needs [Decky Loader](https://decky.xyz)):** in Desktop Mode, download **AutoHDR-installer.desktop** below and double-click it. Or in a terminal:

            ```
            curl -fsSL https://github.com/OldRustyDusty/AutoHDR-SteamOS/releases/latest/download/install.sh | bash
            ```

            See the [README](https://github.com/OldRustyDusty/AutoHDR-SteamOS#readme) for requirements and usage.
